# ==============================================
# Go HTTP 服务配置文件
# ==============================================

# ---------- 服务器基础配置 ----------
server:
  # 服务监听端口
  # 8080 是常用的开发端口，生产环境可以改为 80 或 443
  port: 8080
  
  # 读取请求超时时间
  # 从接收到请求到读取完整个请求头的最大时间
  # 防止慢连接攻击，建议 5-10 秒
  read_timeout: 10s    # 10秒
  
  # 写入响应超时时间
  # 从读取完请求到发送完响应的最大时间
  # 防止客户端慢速读取，建议 10-20 秒
  write_timeout: 10s   # 10秒
  
  # 空闲连接超时时间
  # Keep-Alive 连接的最大空闲时间
  # 超过这个时间没有新请求就关闭连接
  idle_timeout: 120s   # 2分钟
  
  # 请求头最大字节数
  # 防止超大请求头攻击
  # 1MB = 1048576 字节，通常足够
  max_header_bytes: 1048576  # 1MB

# ---------- 请求处理配置 ----------
request:
  # 请求体最大大小（字节）
  # 10MB = 10 * 1024 * 1024
  # 根据业务需求调整：如果只是普通 JSON，10MB 足够
  # 如果有文件上传，可能需要增大
  max_body_size: 10485760  # 10MB
  
  # 请求处理超时时间
  # 整个请求处理（包括业务逻辑）的最大时间
  # 防止慢查询或死循环拖垮服务
  timeout_seconds: 30s  # 30秒

# ---------- 限流配置 ----------
rate_limit:
  # 是否启用限流
  # true: 启用限流保护
  # false: 不限流（适合内部测试或高信任环境）
  enabled: true
  
  # 每秒允许的请求数 (QPS)
  # 根据你的服务器性能和业务需求设置
  # 100 QPS 对于普通服务器是安全值
  requests_per_second: 100
  
  # 突发请求数
  # 允许瞬间超过 QPS 的最大请求数
  # 例如：100 QPS，burst=50，意味着瞬间可以处理 150 个请求
  # 建议是 QPS 的 0.5-1 倍
  burst: 50

# ---------- 日志配置 ----------
log:
  # 日志级别
  # debug: 调试信息（最详细）
  # info: 一般信息（推荐）
  # warn: 警告信息
  # error: 错误信息（最少）
  level: "info"
  
  # 日志输出文件路径
  # 可以是相对路径或绝对路径
  # 如果目录不存在，程序会自动创建
  output: "./logs/app.log"
  # 如果想输出到控制台，可以设为 "stdout"
  # output: "stdout"